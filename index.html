<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Volume Control Widget</title>\n    <style>\n        /* Glassmorphism styling */\n        body {\n            background: linear-gradient(to right, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.1));\n            backdrop-filter: blur(10px);\n            color: white;\n            font-family: Arial, sans-serif;\n        }\n        .volume-control {\n            position: relative;\n            padding: 20px;\n            border-radius: 10px;\n            box-shadow: 0 4px 30px rgba(0,0,0,0.1);\n        }\n        .slider {\n            appearance: none;\n            width: 100%;\n            height: 10px;\n            background: #ddd;\n            border-radius: 5px;\n            outline: none;\n        }\n        .slider::-webkit-slider-thumb {\n            -webkit-appearance: none;\n            appearance: none;\n            width: 20px;\n            height: 20px;\n            background: #007bff;\n            border-radius: 50%;\n            cursor: pointer;\n            animation: thumbAnimation 0.3s ease;\n        }\n        @keyframes thumbAnimation {\n            0% { transform: scale(1); }\n            50% { transform: scale(1.2); }\n            100% { transform: scale(1); }\n        }\n        .volume-display {\n            font-size: 24px;\n            margin: 10px 0;\n        }\n        .volume-bar {\n            width: 100%;\n            background: rgba(255, 255, 255, 0.2);\n            border-radius: 5px;\n            height: 10px;\n        }\n        .current-level {\n            height: 10px;\n            background: #007bff;\n            border-radius: 5px;\n        }\n    </style>\n</head>\n<body>\n    <div class="volume-control">\n        <div class="volume-display">Volume: <span id="volume-percent">50%</span></div>\n        <input type="range" min="0" max="100" value="50" class="slider" id="volume-slider">\n        <div class="volume-bar">\n            <div class="current-level" style="width: 50%;"></div>\n        </div>\n    </div>\n    <script>\n        const slider = document.getElementById('volume-slider');\n        const volumeDisplay = document.getElementById('volume-percent');\n        slider.oninput = function() {\n            volumeDisplay.innerHTML = this.value + "%";\n            document.querySelector('.current-level').style.width = this.value + "%";\n        };\n        document.addEventListener('keydown', function(event) {\n            if (event.key === '+') {\n                slider.value = Math.min(100, parseInt(slider.value) + 5);\n                slider.oninput();\n            } else if (event.key === '-') {\n                slider.value = Math.max(0, parseInt(slider.value) - 5);\n                slider.oninput();\n            } else if (event.key === 'm') {\n                if (slider.value > 0) {\n                    slider.setAttribute('data-muted', 'true');\n                    slider.value = 0;\n                } else {\n                    slider.removeAttribute('data-muted');\n                    slider.value = 50;\n                }\n                slider.oninput();\n            }\n        });\n    </script>\n</body>\n</html>
