<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Lanyard Integration</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #music-player { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Discord Lanyard Integrator</h1>
    <div id="lanyard-container">
        <iframe src="https://discord.com/api/guilds/YOUR_GUILD_ID/widget.json" width="350" height="500" frameborder="0"></iframe>
    </div>

    <div id="music-player">
        <h2>Music Player</h2>
        <audio id="audio" controls>
            <source src="YOUR_AUDIO_SOURCE.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        <br>
        <label for="volume">Volume:</label>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5" />
    </div>

    <script>
        const audio = document.getElementById('audio');
        const volumeControl = document.getElementById('volume');
        
        volumeControl.addEventListener('input', function() {
            audio.volume = volumeControl.value;
        });
    </script>
</body>
</html>
