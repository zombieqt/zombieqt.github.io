<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism UI Design</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0e0e0, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            display: flex;
            width: 80%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        .column {
            padding: 20px;
            flex: 1;
            border-radius: 10px;
            overflow: hidden;
        }
        .discord-status {
            background: rgba(200, 197, 255, 0.5);
            transition: background 0.3s;
        }
        .discord-status:hover {
            background: rgba(200, 197, 255, 0.7);
        }
        .music-player {
            background: rgba(255, 200, 200, 0.5);
            transition: background 0.3s;
        }
        .music-player:hover {
            background: rgba(255, 200, 200, 0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="column discord-status">
            <h2>Discord Status</h2>
            <p>Online</p>
        </div>
        <div class="column music-player">
            <h2>Music Player</h2>
            <p>Currently Playing: Track Title</p>
            <input type="range" min="0" max="100" value="50" />
            <button>Play</button>
            <button>Pause</button>
        </div>
    </div>
    <script>
        // Keyboard shortcuts for play, pause, and volume control
        document.addEventListener('keydown', function(event) {
            if (event.code === 'Space') {
                // Toggle Play/Pause
                console.log('Play/Pause toggled');
            } else if (event.code === 'ArrowUp') {
                // Increase volume
                console.log('Volume increased');
            } else if (event.code === 'ArrowDown') {
                // Decrease volume
                console.log('Volume decreased');
            }
        });
    </script>
</body>
</html>
